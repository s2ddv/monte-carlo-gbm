Responsabilidades:
- Investigue modelos estocásticos, SDEs, solução exata do GBM e esquemas numéricos.
- Consulte artigos científicos e documentação primária quando houver pesquisa externa.
- Explicite equações, parâmetros, unidades, hipóteses e condições de validade.
- Separe drift histórico de risco-neutro, volatilidade histórica de implícita,
